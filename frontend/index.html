<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hr app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mini Payroll Tax Engine</h1>
    <div id="employees-list"></div>
    <h2>Tax Calculator</h2>
    <form id="calculate-form">
        <input type="number" id="gross-pay" placeholder="Enter gross pay" 
                maxlength="10" required>
        <select id="state">
            <option value="CA">California</option>
            <option value="NY">New York</option>
            <option value="TX">Texas</option>
            <option value="FL">Florida</option>
            <option value="IL">Illinois</option>
            <option value="PA">Pennsylvania</option>
        </select>
        <button type="submit">Calculate</button>
    </form>
    <div id="paystub"></div>
    <h2>Chat</h2>
    <div id="chat-messages"></div>
    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="ask about payroll">
        <button type="submit">Send</button>
    </form>
    <h2>Add Employee</h2>
    <form id="add-employee-form">
        <input type="text" id="employee-name" placeholder="Enter employee name" required>
        <input type="number" id="employee-salary" placeholder="Enter employee salary" required>
        <input type="text" id="employee-state" placeholder="Enter employee state" required>
        <input type="text" id="employee-position" placeholder="Enter employee position" required>
        <button type="submit">Add Employee</button>
    </form>
<script src="app.js"></script>    
</body>
</html>
